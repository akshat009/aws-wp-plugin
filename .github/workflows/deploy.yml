name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: CI - Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-interaction --prefer-dist
      - run: composer run phpcs
      - run: composer run phpunit

  deploy:
    name: CD - Atomic Zero-Downtime Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Atomic Deploy via Symlink
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          REL=$(date +%Y%m%d%H%M%S)
          echo "Deploying release: $REL"
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.github' \
            ./ "$SSH_USER@$SSH_HOST":/var/www/releases/$REL/
          ssh "$SSH_USER@$SSH_HOST" "
            ln -sfn /var/www/releases/$REL /var/www/html/wp-content/plugins/aws-wp-plugin && \
            (ls -1dt /var/www/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf)
          "
